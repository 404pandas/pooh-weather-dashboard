<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./assets/css/normalize.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Materialize -->
    <link
      type="text/css"
      rel="stylesheet"
      href="./assets/css/materialize.min.css"
      media="screen,projection"
    />
    <!-- Colors -->
    <link type="text/css" rel="stylesheet" href="./assets/css/colors.css" />
    <!-- Main -->
    <link type="text/css" rel="stylesheet" href="./assets/css/style.css" />

    <title>Pooh Weather Dashboard</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav>
        <div class="nav-wrapper">
          <h1 class="nav-title">Pooh Weather Dashboard</h1>
        </div>
      </nav>
    </header>

    <!-- Page Layout -->
    <div class="page-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2 class="sidebar-heading">Search for a City</h2>

        <!-- Search Form -->
        <form id="searchForm" class="search-form">
          <div class="input-field">
            <input
              placeholder="Hundred Aker Wood..."
              id="searchInput"
              type="text"
              class="validate"
            />
            <label for="searchInput">City Name</label>
          </div>
          <button
            class="btn btn-search waves-effect waves-light"
            type="submit"
            name="action"
          >
            <i class="material-icons left">search</i>
            Search
          </button>
        </form>

        <!-- Alerts -->
        <div id="alerts">
          <div
            id="error"
            class="alert-box red lighten-4 red-text text-darken-4 hidden"
          >
            <i class="material-icons">report</i>
            <p>City not found. Please try again.</p>
          </div>
        </div>

        <!-- Search History -->
        <div id="history-section" class="history-section">
          <h3 class="history-heading hidden" id="historyHeading">
            Recent Searches
          </h3>
          <div id="history" class="history-list"></div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Current Weather -->
        <section id="current" class="current-section">
          <!-- Populated by JS -->
        </section>

        <!-- 5-Day Forecast -->
        <section id="forecast" class="forecast-section">
          <!-- Populated by JS -->
        </section>
      </main>
    </div>
    <!-- end .page-layout -->

    <!-- Scripts -->
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-3.6.3.js"
    ></script>
    <script
      type="text/javascript"
      src="./assets/js/materialize.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script type="text/javascript" src="./assets/js/script.js"></script>
  </body>
</html>
