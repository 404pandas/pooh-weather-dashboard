<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./assets/css/normalize.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Materialize -->
    <link
      type="text/css"
      rel="stylesheet"
      href="./assets/css/materialize.min.css"
      media="screen,projection"
    />
    <!-- Colors -->
    <link type="text/css" rel="stylesheet" href="./assets/css/colors.css" />
    <!-- Main -->
    <link type="text/css" rel="stylesheet" href="./assets/css/style.css" />

    <title>Pooh Weather Dashboard</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav>
        <div class="nav-wrapper">
          <h1 class="nav-title">Pooh Weather Dashboard</h1>
          <div class="unit-toggle">
            <button class="unit-toggle-btn active" data-unit="F">°F</button>
            <button class="unit-toggle-btn" data-unit="C">°C</button>
          </div>
        </div>
      </nav>
    </header>

    <!-- Page Layout -->
    <div class="page-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2 class="sidebar-heading">Search for a City</h2>

        <!-- Search Form -->
        <form id="searchForm" class="search-form">
          <div class="input-field">
            <input
              placeholder="Hundred Aker Wood..."
              id="searchInput"
              type="text"
              class="validate"
            />
            <label for="searchInput">City Name</label>
          </div>
          <button class="btn btn-location waves-effect" type="button" id="locationBtn">
            <i class="material-icons" id="locationIcon">my_location</i>
            Use My Location
          </button>
          <button
            class="btn btn-search waves-effect waves-light"
            type="submit"
            name="action"
          >
            <i class="material-icons">search</i>
            Search
          </button>
        </form>

        <!-- Alerts -->
        <div id="alerts">
          <div
            id="error"
            class="alert-box red lighten-4 red-text text-darken-4 hidden"
          >
            <i class="material-icons">report</i>
            <p id="errorMsg">City not found. Please try again.</p>
          </div>
        </div>

        <!-- Search History -->
        <div id="history-section" class="history-section">
          <h3 class="history-heading hidden" id="historyHeading">
            Recent Searches
          </h3>
          <div id="history" class="history-list"></div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Current Weather -->
        <section id="current" class="current-section">
          <!-- Populated by JS -->
        </section>

        <!-- 5-Day Forecast -->
        <section id="forecast" class="forecast-section">
          <!-- Populated by JS -->
        </section>
      </main>
    </div>
    <!-- end .page-layout -->

    <!-- Loader overlay (Pooh-themed bee + honey pot) -->
    <div id="loader" class="loader-overlay hidden">
      <div class="loader-scene">
        <div class="honey-pot">🍯</div>
        <div class="bee-orbit-wrapper">
          <span class="bee-counter-rotate">🐝</span>
        </div>
      </div>
      <p class="loader-msg">Pooh is checking the honey pot weather gauge…</p>
    </div>

    <!-- Scripts -->
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-3.6.3.js"
    ></script>
    <script
      type="text/javascript"
      src="./assets/js/materialize.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script type="text/javascript" src="./assets/js/config.js"></script>
    <script type="text/javascript" src="./assets/js/globals.js"></script>
    <script type="text/javascript" src="./assets/js/utils.js"></script>
    <script type="text/javascript" src="./assets/js/animations.js"></script>
    <script type="text/javascript" src="./assets/js/effects.js"></script>
    <script type="text/javascript" src="./assets/js/ui.js"></script>
    <script type="text/javascript" src="./assets/js/history.js"></script>
    <script type="text/javascript" src="./assets/js/render.js"></script>
    <script type="text/javascript" src="./assets/js/api.js"></script>
    <script type="text/javascript" src="./assets/js/app.js"></script>
  </body>
</html>
